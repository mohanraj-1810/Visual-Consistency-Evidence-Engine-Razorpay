name: Security & Vulnerability Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run weekly on Sunday midnight
    - cron: '0 0 * * 0'

jobs:
  security-audit:
    name: Bandit Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit AST Security Audit
        run: |
          bandit -r backend -ll -ii -x backend/tests,backend/venv --format custom --msg-template "{abspath}:{line}: {severity}[{test_id}]: {msg}" || true
