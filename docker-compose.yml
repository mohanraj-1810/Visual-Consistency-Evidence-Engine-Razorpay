services:
  visual-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visual-consistency-engine
    ports:
      - "8000:8000"
    environment:
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      - SERPAPI_API_KEY=${SERPAPI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_CSE_ID=${GOOGLE_CSE_ID:-}
      - HF_HOME=/app/cache/huggingface
      - TORCH_HOME=/app/cache/torch
    volumes:
      # Persistent named volumes to avoid re-downloading HuggingFace ViT weights across container restarts
      - hf_model_cache:/app/cache/huggingface
      - torch_model_cache:/app/cache/torch
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  hf_model_cache:
    name: visual_engine_hf_cache
  torch_model_cache:
    name: visual_engine_torch_cache
